services:
  wk-node1:
    image: wukongim-dev:local
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      - ./docker/conf/single-node.conf:/etc/wukongim/wukongim.conf:ro
      - ./docker/single-node/data:/var/lib/wukongim
      - uploads:/var/lib/wukongim/uploads
    ports:
      - "5001:5001"
      - "15100:5100"
      - "15200:5200"
      - "17100:7000"

  wk-web:
    image: wk-web:local
    restart: unless-stopped
    depends_on:
      - wk-node1
    environment:
      WK_WEB_API_URL: ${WK_WEB_API_URL:-http://wk-node1:5301}
    volumes:
      - ./docker/chatdemo:/usr/share/nginx/chatdemo:ro
      - uploads:/usr/share/nginx/uploads:ro
    ports:
      - "18080:80"

  prometheus:
    image: prom/prometheus:v3
    restart: unless-stopped
    depends_on:
      - wk-node1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    volumes:
      - ./docker/observability/prometheus/prometheus-single.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/single-node/prometheus:/prometheus
    ports:
      - "9091:9090"

  grafana:
    image: grafana/grafana:13.1.0-24485707904
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: Aa12345678
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./docker/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/observability/grafana/dashboards:/etc/grafana/dashboards:ro
      - ./docker/single-node/grafana:/var/lib/grafana
    ports:
      - "3000:3000"

volumes:
  uploads:
